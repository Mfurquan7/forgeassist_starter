<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ForgeAssist AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 420px;">
            <h2 class="text-center mb-2">ForgeAssist AI</h2>
            <p class="text-center text-secondary mb-4">Manufacturing Manual Assistant</p>

            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" autocomplete="username"
                        required autofocus>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</body>

</html>
